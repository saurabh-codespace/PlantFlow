spring.application.name=transport-service
server.port=8082
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/transport}
spring.datasource.username=${DB_USER:transport}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.locations=classpath:db/migration,classpath:db/common
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER:http://localhost:8081/realms/plantflow}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OIDC_JWK_SET_URI:http://localhost:8081/realms/plantflow/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.audiences=plantflow-api
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:plantflow}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.jackson.serialization.write-dates-as-timestamps=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never
server.shutdown=graceful
logging.level.com.plantflow=INFO
