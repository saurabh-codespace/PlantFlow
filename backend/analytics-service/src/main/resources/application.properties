spring.application.name=analytics-service
server.port=8084
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/plantflow_analytics}
spring.datasource.username=${DB_USER:plantflow_analytics}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.locations=classpath:db/migration,classpath:db/common
spring.jackson.serialization.write-dates-as-timestamps=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER:http://localhost:8081/realms/plantflow}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OIDC_JWK_SET_URI:${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.audiences=plantflow-api
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:plantflow}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
plantflow.messaging.enabled=${MESSAGING_ENABLED:true}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
